server.port=${APPLICATION_PORT:8080}

# application info
application.name=@project.name@
application.description=@project.description@
application.version=@project.version@

# Database config
#
# Credentials come from the environment - never commit them:
#   PowerShell : $env:DB_USERNAME="recipesuser"; $env:DB_PASSWORD="..."; ./mvnw spring-boot:run
#   Bash       : DB_USERNAME=recipesuser DB_PASSWORD=... ./mvnw spring-boot:run
#
# DB_PASSWORD has no default. Note that Spring does not error on an unresolved placeholder here -
# it passes the literal text through - so a missing DB_PASSWORD surfaces at startup as an
# "Access denied for user 'recipesuser'" failure from Liquibase, not as a placeholder error.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recipes}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:recipesuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# No spring.jpa.database-platform: Hibernate resolves the dialect from JDBC metadata.
# Versioned dialects (MySQL8Dialect) are deprecated in Hibernate 6 and removed in 7.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# physical naming strategy (entity camelCase -> snake_case columns)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# logging
#
# Quiet by default. SQL statements and bind values are switched on in the 'dev' profile only -
# logging them here would write user data to the log and cost throughput in production.
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

# liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
