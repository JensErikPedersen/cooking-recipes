# Configuration for the liquibase-maven-plugin (mvn liquibase:status, liquibase:update, ...).
#
# Credentials are deliberately absent - pass them on the command line so they are never committed:
#   ./mvnw liquibase:status -Dliquibase.username=recipesadmin -Dliquibase.password=...
#
# The driver is resolved from the project's own dependencies; do not pin a local .m2 path here.
changelogFile: src/main/resources/db/changelog/db.changelog-master.xml
driver: com.mysql.cj.jdbc.Driver
url: jdbc:mysql://localhost:3306/recipes?useSSL=false
defaultSchemaName: recipes
